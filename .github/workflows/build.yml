name: Java CI with Gradle

# This workflow triggers whenever you push to main, or open a Pull Request against main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Grab your code from the repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Start the database and RabbitMQ in the background
    - name: Start Docker Infrastructure
      run: docker compose up -d

    # 3. Install Java 25 (Temurin matches your local Eclipse Adoptium install)
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # 4. Give the Gradle wrapper permission to execute
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 5. Run the actual build and tests!
    - name: Build with Gradle
      run: ./gradlew build

    # 6. Clean up containers
    - name: Stop Docker Infrastructure
      if: always()
      run: docker compose down